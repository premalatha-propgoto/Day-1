<!DOCTYPE html>
<html>
<head>
<title>Product Details</title>

<style>
body { font-family: Arial; 
  padding: 20px; }
img { width: 300px; }

.review {
  border-top: 1px solid #ccc;
  margin-top: 10px;
  padding-top: 10px;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: white;
  padding: 10px;
}

#snackbar {
  visibility: hidden;
  min-width: 250px;
  background-color: #333;
  color: #fff;
  padding: 14px 18px;
  border-radius: 6px;
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 16px;
  z-index: 9999;
  opacity: 0;
  transform: translateY(-20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

#snackbar.show {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
}

#snackbar.success {
  background-color: #4caf50;
}

#snackbar.error {
  background-color: #e53935;
}

</style>
</head>

<body>
<div id="snackbar"></div>
<div class="header">
  <h2>Product Details</h2>
</div>

<br><br><br>

<div id="productDetails">Loading...</div>

<script>
  function showSnackbar(message, type = "success") {
  const sb = document.getElementById("snackbar");
  sb.innerText = message;
  sb.className = `show ${type}`;

  setTimeout(() => {
    sb.className = sb.className.replace("show", "");
  }, 3000);
}

function deleteProduct(id) {
  fetch(`http://localhost:5000/product/${id}`, {
    method: "DELETE"
  })
  .then(res => res.json())
  .then(data => {
    showSnackbar("Product deleted successfully!", "success");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  })
  .catch(err => {
    showSnackbar("Failed to delete product!", "error");
  });
}


function storeView(productId, title) {
  fetch("http://localhost:5000/view", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      product_id: productId,
      product_name:title
    })
  });
}

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

function loadProduct(id) {
  fetch(`http://localhost:5000/get_products/${id}`)
  .then(res => res.json())
  .then(product => {

    storeView(product.id, product.title);

    document.getElementById("productDetails").innerHTML = `
      <div style="position:relative;">
        
        <span 
          onclick="deleteProduct(${product.id})"
          style="
            position:absolute;
            bottom:10px;
            right:10px;
            cursor:pointer;
            font-size:22px;
            color:red;
          ">
          
        </span>

        <!-- 🔥 Dummy Image for all products -->
        <img src="default.jpg">

        <h3>${product.title}</h3>
        <p>${product.description}</p>
        <p><b>Category:</b> ${product.category}</p>
        <p><b>Price:</b> ${product.price}</p>
        <p><b>Stock:</b> ${product.stock}</p>
        <p><b>Rating:</b> ${product.rating}</p>
        <br>
        <button onclick="history.back()">Back</button>
      </div>
    `;
  });
}

loadProduct(productId);
</script>
</body>
</html>
