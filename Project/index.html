<!DOCTYPE html>
<html>
<head>
<title>Products</title>

<style>
body { font-family: Arial; padding: 20px; }

#products {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.product-box {
  width: 220px;
  border: 1px solid #ccc;
  padding: 10px;
  cursor: pointer;
}

.product-box img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: white;
  padding: 10px;
}

input, select {
  padding: 8px;
  margin: 10px 5px 20px 0;
}
</style>
</head>

<body>

<div class="header">
  <h2>Products</h2>

  <input id="searchInput"
         placeholder="Search title, price or category">

  <select id="categorySelect">
    <option value="all">All Categories</option>
  </select>
</div>

<br><br><br><br>

<div id="products"></div>

<script>
let allProducts = [];

const searchInput = document.getElementById("searchInput");
const categorySelect = document.getElementById("categorySelect");

function storeSearch(productId, keyword) {
  if (!keyword || keyword.length < 2) return;

  fetch("http://localhost:5000/search", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      product_id: productId,
      keyword: keyword
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Matched products:", data);
  })
  .catch(err => console.log(err));
}

fetch("https://dummyjson.com/products?limit=100")
.then(res => res.json())
.then(data => {
  allProducts = data.products;
  populateCategories();
  displayProducts();
});

function populateCategories() {
  const categories =
    [...new Set(allProducts.map(p => p.category))];

  categories.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    categorySelect.appendChild(option);
  });
}

function displayProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  const search = searchInput.value.toLowerCase();
  const selectedCategory = categorySelect.value;

  const filtered = allProducts.filter(p => {
    const catMatch =
      selectedCategory === "all" ||
      p.category === selectedCategory;

    const searchMatch =
      p.title.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search) ||
      p.price.toString().includes(search);

    return catMatch && searchMatch;
  });

  filtered.forEach(product => {
    const box = document.createElement("div");
    box.className = "product-box";

    box.innerHTML = `
      <img src="${product.thumbnail}">
      <h4>${product.title}</h4>
      <p>${product.category}</p>
      <p>$${product.price}</p>
    `;

    box.onclick = () => {
      storeSearch(product.id, searchInput.value);
      window.location.href = "product.html?id=" + product.id;
    };

    container.appendChild(box);
  });
}

/* store search while typing */
searchInput.addEventListener("input", () => {
  displayProducts();
  storeSearch(null, searchInput.value.trim());
});

categorySelect.addEventListener("change", displayProducts);
</script>
</body>
</html>
