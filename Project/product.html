<!DOCTYPE html>
<html>
<head>
<title>Product Details</title>

<style>
body { font-family: Arial; padding: 20px; }
img { width: 300px; }

.review {
  border-top: 1px solid #ccc;
  margin-top: 10px;
  padding-top: 10px;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: white;
  padding: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h2>Product Details</h2>
</div>

<br><br><br>

<div id="productDetails">Loading...</div>

<script>
function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;

  fetch(`http://localhost:5000/product/${id}`, {
    method: "DELETE"
  })
  .then(res => res.json())
  .then(data => {
    alert("Product deleted successfully");
    window.location.href = "index.html"; 
  })
  .catch(err => console.error(err));
}

function storeView(productId, title) {
  fetch("http://localhost:5000/view", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      product_id: productId,
      product_name: title
    })
  });
}

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

function loadProduct(id) {
  fetch(`http://localhost:5000/get_products/${id}`)
  .then(res => res.json())
  .then(product => {

    storeView(product.id, product.title);

    document.getElementById("productDetails").innerHTML = `
      <div style="position:relative;">
        
        <span 
          onclick="deleteProduct(${product.id})"
          style="
            position:absolute;
            bottom:10px;
            right:10px;
            cursor:pointer;
            font-size:22px;
            color:red;
          ">
          🗑️
        </span>

        <!-- 🔥 Dummy Image for all products -->
        <img src="default.jpg">

        <h3>${product.title}</h3>
        <p>${product.description}</p>
        <p><b>Category:</b> ${product.category}</p>
        <p><b>Price:</b> ${product.price}</p>
        <p><b>Stock:</b> ${product.stock}</p>
        <p><b>Rating:</b> ${product.rating}</p>
        <br>
        <button onclick="history.back()">Back</button>
      </div>
    `;
  });
}

loadProduct(productId);
</script>
</body>
</html>
